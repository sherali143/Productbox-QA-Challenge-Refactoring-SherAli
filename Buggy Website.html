<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
    <link rel="stylesheet" href="styles/style.css">
    <title>Buggy Website</title>
</head>
<body>
    <div id="wrapper">
        <form action="" name="signup" id="form">
            <h3>Sign Up</h3>
            <div class="form-group">
                <label for="">First Name<span>*</span></label>
                <input type="text" placeholder="Enter First Name" id="first-name">
            </div>
            <div class="form-group">
                <label for="">Last Name<span>*</span></label>
                <input type="text" placeholder="Enter Last Name" id="last-name">
            </div>
            <div class="form-group">
                <label for="">Father Name<span>*</span></label>
                <input type="text" placeholder="Enter Father Name" required id="father-name">
            </div>
            <div class="form-group">
                <label for="">Email<span>*</span></label>
                <input type="email" placeholder="Enter Email" id="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number<span>*</span></label>
                <input type="tel" placeholder="Enter Phone Number" required id="phone" pattern="[0-9]{10,15}">
            </div>

            <div id="radio-wrapper" class="form-group">
                <div>Gender</div>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
            </div>
            

            <div class="form-group">
                <label for="dob">Date of birth<span>*</span></label>
                <input type="date" placeholder="Enter Date of birth" id="dob" min="1900-01-01">
            </div>
            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" placeholder="Enter Country" id="country" maxlength="50">
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" placeholder="Enter City" id="city" maxlength="50">
            </div>
            <div class="form-group">
                <button type="submit" id="submit-btn">Agree and Join</button>
            </div>
        </form>
    </div>

    <script>
        const submit = false;
        const form = document.querySelector("#form");
        const submitButton = document.querySelector("#submit-btn");
        const firstNameInput = document.querySelector("#first-name");
        const lastNameInput = document.querySelector("#last-name");
        const emailInput = document.querySelector("#email");
        const fatherNameInput = document.querySelector("#father-name");
        const phoneInput = document.querySelector("#phone");
        const dobInput = document.querySelector("#dob");

        function validateNameInput(event) {
            const regex = /^[A-Za-z\s]+$/;
            if (!regex.test(event.key) && event.key !== 'Backspace' && event.key !== 'Delete' && event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') {
                event.preventDefault();
                return false;
            }
        }

        function validateEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }
        
        // Validate phone format
        function validatePhone(phone) {
            const regex = /^[0-9]{10,15}$/;
            return regex.test(phone);
        }

        
        
        firstNameInput.addEventListener("keydown", validateNameInput);
        lastNameInput.addEventListener("keydown", validateNameInput);
        fatherNameInput.addEventListener("keydown", validateNameInput);

        const onSubmit = (event) => {
            event.preventDefault();
            const firstName = firstNameInput.value;
            const lastName = lastNameInput.value;
            const email = emailInput.value;
            const fatherName = fatherNameInput.value;
            const phone = phoneInput.value;
            const dob = dobInput.value;
            
            // First name validation
            if(!firstName.trim()) {
                alert("First name can't be empty");
                firstNameInput.focus();
                return false;
            }
            
            // Last name validation
            if(!lastName.trim()) {
                alert("Last name can't be empty");
                lastNameInput.focus();
                return false;
            }
            
            // Father name validation
            if(!fatherName.trim()) {
                alert("Father name can't be empty");
                fatherNameInput.focus();
                return false;
            }
            
            // Email validation
            if(!email.trim()) {
                alert("Email is required");
                emailInput.focus();
                return false;
            }
            
            if(!validateEmail(email)) {
                alert("Please enter a valid email address");
                emailInput.focus();
                return false;
            }
            
            // Phone validation
            if(!phone.trim()) {
                alert("Phone number is required");
                phoneInput.focus();
                return false;
            }
            
            if(!validatePhone(phone)) {
                alert("Please enter a valid phone number (10-15 digits)");
                phoneInput.focus();
                return false;
            }
            
            // Date of birth validation
            if(!dob) {
                alert("Date of birth is required");
                dobInput.focus();
                return false;
            }
            
            // Gender validation
            const genderSelected = document.querySelector('input[name="gender"]:checked');
            if(!genderSelected) {
                alert("Please select a gender");
                return false;
            }
            
            // If all validations pass, proceed
            localStorage.setItem("fullName", firstName + " " + lastName);
            localStorage.setItem("loggedin", 1);
            window.location = "dashboard.html";
        }

        submitButton.addEventListener("dblclick", onDoubleClick);
        submitButton.addEventListener("click", onSubmit);
    </script>
</body>
</html>
